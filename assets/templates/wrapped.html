<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>%%TITLE%%</title>
<style>
/*FONTS*/
:root{--paper:#f2e9d6;--paper-hi:#faf5ea;--ink:#1c1915;--ink-2:#4a443a;--ink-3:#8a8172;--rule:#d8cbb0;--zhu:#b5321d;--zhu-soft:rgba(181,50,29,.1);
--serif:"Ink","Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;--hand:"Hand","Kaiti SC","STKaiti","KaiTi",var(--serif);--brush:"Brush","Hand",var(--serif);
--gut:clamp(22px,6vw,56px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{color:var(--ink);font:400 17px/1.8 var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.deck{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden;touch-action:pan-y}
.slide{position:absolute;inset:0;padding:64px var(--gut) 56px;display:flex;flex-direction:column;overflow-y:auto;
background:var(--paper);transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .45s;transform:translateX(100%);opacity:0}
.slide.on{transform:none;opacity:1}
.slide.past{transform:translateX(-30%);opacity:0}
.slide.dark{background:var(--ink);color:var(--paper)}
.slide.red{background:var(--zhu);color:var(--paper-hi)}
.in{margin:auto 0;width:100%}
.in>*{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.on .in>*{opacity:1;transform:none}
.on .in>*:nth-child(2){transition-delay:.12s}.on .in>*:nth-child(3){transition-delay:.24s}
.on .in>*:nth-child(4){transition-delay:.36s}.on .in>*:nth-child(n+5){transition-delay:.48s}
.bars{position:fixed;top:12px;left:0;right:0;max-width:560px;margin:0 auto;padding:0 14px;display:flex;gap:4px;z-index:5;pointer-events:none}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(138,129,114,.35)}
.bars i.done{background:var(--zhu)}
.bars.light i{background:rgba(250,245,234,.3)}.bars.light i.done{background:var(--paper-hi)}
.k{font:700 13px/1.4 var(--serif);letter-spacing:.35em;color:var(--ink-3);margin-bottom:18px}
.dark .k,.red .k{color:rgba(250,245,234,.65)}
.huge{font:400 clamp(88px,30vw,160px)/1 var(--brush);letter-spacing:.02em}
.big{font:700 clamp(56px,17vw,96px)/1.05 var(--serif);color:var(--zhu);letter-spacing:-.01em}
.dark .big{color:#e2674f}
.red .big{color:var(--paper-hi)}
.unit{font:700 18px/1.4 var(--serif);letter-spacing:.2em;margin-top:6px}
.lede{font:400 19px/1.9 var(--hand);color:var(--ink-2);margin-top:22px}
.dark .lede,.red .lede{color:rgba(250,245,234,.85)}
.lede b{color:var(--zhu);font-weight:400}
.dark .lede b{color:#e2674f}
.name{font:400 clamp(64px,20vw,112px)/1.05 var(--brush);margin-bottom:6px;word-break:break-all}
.row{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0 6px}
.row div b{display:block;font:700 34px/1.2 var(--serif);color:var(--zhu)}
.row div span{font:700 12px/1 var(--serif);letter-spacing:.25em;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips span{font:400 17px/1.3 var(--hand);border:1.5px solid var(--zhu);color:var(--zhu);background:var(--zhu-soft);padding:4px 14px;border-radius:20px;max-width:100%;overflow-wrap:anywhere}
.sec{font:700 12px/1 var(--serif);letter-spacing:.35em;color:var(--ink-3);margin:26px 0 10px;padding-top:16px;border-top:1px solid var(--rule)}
.ev h3{font:700 22px/1.4 var(--serif)}
.ev time{font:400 13px/1 var(--serif);color:var(--ink-3);letter-spacing:.1em}
.ev p{font:400 16px/1.85 var(--hand);color:var(--ink-2);margin-top:6px}
.chat{margin-top:10px;font:400 14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-2);background:var(--paper-hi);border-radius:8px;padding:8px 12px}
.chat b{color:var(--zhu);margin-right:6px}
ol.top{list-style:none;counter-reset:t}
ol.top li{counter-increment:t;display:grid;grid-template-columns:36px 1fr;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--rule);font:400 17px/1.4 var(--serif)}
ol.top li:before{content:counter(t);font:400 24px/1 var(--brush);color:var(--zhu)}
ol.top small{display:block;font:400 12px/1.3 var(--serif);color:var(--ink-3);letter-spacing:.08em}
.list{list-style:none;margin-top:16px}
.list li{font:400 18px/1.6 var(--hand);padding:6px 0;border-bottom:1px solid rgba(250,245,234,.2)}
.hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;font:400 13px/1 var(--serif);letter-spacing:.3em;color:var(--ink-3)}
.dark .hint{color:rgba(250,245,234,.5)}
.seal{display:inline-grid;place-items:center;width:58px;height:58px;background:var(--zhu);color:var(--paper-hi);font:400 20px/1 var(--brush);writing-mode:vertical-rl;border-radius:4px;transform:rotate(-4deg);margin-top:28px}
.foot{font:400 13px/1.8 var(--serif);color:rgba(250,245,234,.55);margin-top:30px}
@media (prefers-reduced-motion:reduce){.slide,.in>*{transition:none}}
</style>
</head>
<body>
<main class="deck" id="deck" aria-live="polite">
%%SLIDES%%
</main>
<div class="bars" id="bars" aria-hidden="true"></div>
<script>
(function(){
var S=[].slice.call(document.querySelectorAll('.slide')),cur=0,bars=document.getElementById('bars');
bars.innerHTML=S.map(function(){return '<i></i>'}).join('');
var B=[].slice.call(bars.children);
function go(i){
  cur=Math.max(0,Math.min(S.length-1,i));
  S.forEach(function(s,k){s.classList.toggle('on',k===cur);s.classList.toggle('past',k<cur);s.setAttribute('aria-hidden',k!==cur)});
  B.forEach(function(b,k){b.classList.toggle('done',k<=cur)});
  bars.classList.toggle('light',/\b(dark|red)\b/.test(S[cur].className));
  if(history.replaceState)history.replaceState(null,'','#'+(cur+1));
}
var x0=null,y0=null,moved=false;
var deck=document.getElementById('deck');
deck.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;moved=false},{passive:true});
deck.addEventListener('touchend',function(e){
  if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){moved=true;go(cur+(dx<0?1:-1))}
});
deck.addEventListener('click',function(e){
  if(moved){moved=false;return}
  if(window.getSelection&&String(window.getSelection()))return;
  go(cur+(e.clientX<deck.getBoundingClientRect().left+deck.clientWidth*.3?-1:1));
});
addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
});
go((parseInt(location.hash.slice(1),10)||1)-1);
})();
</script>
</body>
</html>
